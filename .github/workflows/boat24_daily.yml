
name: Boat24 forward predictions and results

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boat24-ledger
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect forecasts and results
        run: python boat24_daily.py

      - name: Save forecasts safely
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- omura/docs/boat24_ledger.json; then
            echo "No changes to save"
            exit 0
          fi

          for attempt in 1 2 3 4 5; do
            echo "Save attempt $attempt"

            git fetch origin main
            git reset --hard origin/main

            python boat24_daily.py

            git add omura/docs/boat24_ledger.json

            if git diff --cached --quiet; then
              echo "Already up to date"
              exit 0
            fi

            git commit -m "Record boat24 forecasts and results"

            if git push origin HEAD:main; then
              echo "Saved successfully"
              exit 0
            fi

            sleep 3
          done

          echo "Failed to save after 5 attempts"
          exit 1
