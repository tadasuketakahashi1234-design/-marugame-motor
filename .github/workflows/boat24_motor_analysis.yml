name: Boat24 motor research
on:
  workflow_dispatch:
  schedule:
    - cron: '17 20 * * *'
permissions:
  contents: write
concurrency:
  group: boat24-motor-research
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build motor research report
        env:
          BOAT24_HISTORY_DAYS: '28'
        run: python boat24_motor_analysis.py
      - name: Commit research report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add omura/docs/boat24_motor_analysis.json
          git diff --cached --quiet || (git commit -m "Update motor research report" && git pull --rebase && git push)
