name: Boat24 repair and automatic updates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/boat24_repair.yml']
  schedule:
    - cron: '*/10 * * * *'
permissions:
  contents: write
  actions: write
  pages: write
concurrency:
  group: boat24-state
  cancel-in-progress: false
jobs:
  repair-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install tested source without touching prediction history
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, subprocess, tempfile, time, zlib
          from pathlib import Path
          PAYLOAD = ""
          VERSION = "b8f02ba8dab85bdcfad0adbda345b97e10dfc2a731a970c3bb83c50f595aa1c7"
          compressed=base64.b64decode(PAYLOAD)
          assert hashlib.sha256(compressed).hexdigest()==VERSION, 'Repair payload checksum mismatch'
          entries=json.loads(zlib.decompress(compressed))
          marker='boat24_repair_version.json'
          root=Path.cwd()
          def git(*args,cwd=None):
              return subprocess.check_output(['git',*args],cwd=cwd or root,text=True).strip()
          def current_marker():
              found=subprocess.run(['git','show','origin/main:'+marker],text=True,capture_output=True)
              return json.loads(found.stdout) if found.returncode==0 else {}
          for attempt in range(5):
              git('fetch','origin','main')
              if current_marker().get('version')==VERSION:
                  print('Repair version is already installed; repository code is not overwritten')
                  break
              with tempfile.TemporaryDirectory(prefix='boat24-install-') as tmp:
                  work=Path(tmp)/'checkout'
                  git('worktree','add','--detach',str(work),'origin/main')
                  try:
                      for entry in entries:
                          path=work/entry['path']
                          assert not Path(entry['path']).is_absolute() and '..' not in Path(entry['path']).parts
                          actual=hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None
                          desired=hashlib.sha256(entry['content'].encode()).hexdigest()
                          if actual not in (entry['before'],desired):
                              raise RuntimeError('Concurrent source edit; not replacing '+entry['path'])
                          path.parent.mkdir(parents=True,exist_ok=True)
                          path.write_text(entry['content'],encoding='utf-8')
                      subprocess.run(['python','-m','unittest','discover','-s','tests','-v'],cwd=work,check=True)
                      (work/marker).write_text(json.dumps({'version':VERSION,'installer':'boat24_repair.yml'}))
                      git('add','--',*[entry['path'] for entry in entries],marker,cwd=work)
                      git('-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','Repair Boat24 persistence and settlement while preserving prediction history',cwd=work)
                      pushed=subprocess.run(['git','push','origin','HEAD:main'],cwd=work)
                      if pushed.returncode==0:
                          print('Validated repair installed')
                          break
                  finally:
                      git('worktree','remove','--force',str(work))
              time.sleep(2)
          else:
              raise RuntimeError('Could not publish repair after 5 attempts; original history retained')
          # Load the actually published code into this runner, without replacing any data.
          git('fetch','origin','main')
          for entry in entries:
              path=root/entry['path']
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(git('show','origin/main:'+entry['path'])+'\n',encoding='utf-8')

          PY
      - name: Replace old duplicate schedules
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          REPO=os.environ['GITHUB_REPOSITORY']
          def api(path,method='GET'):
              req=urllib.request.Request('https://api.github.com/repos/'+REPO+path,method=method,
                  headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],
                           'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=30) as response:
                  value=response.read()
                  return json.loads(value) if value else {}
          for name in ['boat24_daily.yml','boat24_compare.yml']:
              api('/actions/workflows/'+name+'/disable','PUT')
              state=api('/actions/workflows/'+name)['state']
              if state!='disabled_manually':
                  raise RuntimeError('Could not disable legacy duplicate workflow: '+name)
              print('Replaced duplicate schedule:',name)

          PY
      - name: Load latest inputs and capture history guard
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          subprocess.run(['git','fetch','origin','main'],check=True)
          for path in ['omura/docs/boat24_ledger.json','omura/docs/boat24_comparison.json','omura/docs/boat24_motor_analysis.json']:
              value=subprocess.check_output(['git','show','origin/main:'+path])
              json.loads(value)
              Path(path).write_bytes(value)
          Path(os.environ['RUNNER_TEMP'],'boat24-history-before.json').write_bytes(Path('omura/docs/boat24_ledger.json').read_bytes())

          PY
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Collect forecasts and results once
        run: python boat24_daily.py
      - name: Merge and save the forecast ledger
        run: python boat24_publish.py omura/docs/boat24_ledger.json
      - name: Read saved ledger for model comparison
        run: |
          git fetch origin main
          git show origin/main:omura/docs/boat24_ledger.json > omura/docs/boat24_ledger.json
          git show origin/main:omura/docs/boat24_comparison.json > omura/docs/boat24_comparison.json
      - name: Update forward model comparison
        run: python boat24_compare.py
      - name: Save comparison without replacing its history
        run: python boat24_publish.py omura/docs/boat24_comparison.json --key records
      - name: Verify original forecast history
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          subprocess.run(['git','fetch','origin','main'],check=True)
          before=json.loads(Path(os.environ['RUNNER_TEMP'],'boat24-history-before.json').read_text())['predictions']
          latest=json.loads(subprocess.check_output(['git','show','origin/main:omura/docs/boat24_ledger.json']))
          for code,record in before.items():
              assert code in latest['predictions'], 'Forecast disappeared: '+code
              for field in ('created_at','selection','probabilities','input_snapshot'):
                  assert record.get(field)==latest['predictions'][code].get(field), 'Forecast changed: '+code+' '+field
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Boat24 checks\n\n')
              f.write('- Original forecasts retained: '+str(len(before))+'\n')
              f.write('- Forecasts after update: '+str(len(latest['predictions']))+'\n')
              f.write('- Immutable dates, picks, probabilities and input snapshots: PASS\n')
              f.write('- Summary: `'+json.dumps(latest.get('summary',{}),ensure_ascii=False)+'`\n')
          print('History preservation confirmed:',len(before),'->',len(latest['predictions']))

          PY
      - name: Rebuild and verify GitHub Pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          REPO=os.environ['GITHUB_REPOSITORY']
          def api(path,method='GET'):
              req=urllib.request.Request('https://api.github.com/repos/'+REPO+path,method=method,
                  headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],
                           'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=30) as response:
                  value=response.read()
                  return json.loads(value) if value else {}
          import time
          from urllib.error import HTTPError
          site=api('/pages')
          if site.get('build_type')!='legacy':
              raise RuntimeError('This installer expects the existing branch-based Pages setup')
          build=api('/pages/builds','POST')
          endpoint='/pages/builds/latest'
          for attempt in range(48):
              status=api(endpoint)
              if status.get('status')=='built':
                  print('Pages build completed:',status.get('commit'))
                  break
              if status.get('status')=='errored':
                  raise RuntimeError('Pages build failed: '+str(status.get('error')))
              time.sleep(5)
          else:
              raise RuntimeError('Pages build did not finish in four minutes; check the Pages run')

          PY
      - name: Preserve observations if a step fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: boat24-recovery-${{ github.run_id }}
          path: |
            omura/docs/boat24_ledger.json
            omura/docs/boat24_comparison.json
          retention-days: 30
