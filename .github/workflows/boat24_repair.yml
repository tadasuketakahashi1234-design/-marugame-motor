# Installs versioned all-input forecasts once; keeps all original prediction histories.
name: Boat24 repair and automatic updates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/boat24_repair.yml']
  schedule:
    - cron: '*/5 23,0-14 * * *'
permissions:
  contents: write
  pages: write
concurrency:
  group: boat24-state
  cancel-in-progress: false
jobs:
  update-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare official racer registry decompression
        run: |
          if ! python -c 'import ctypes.util,sys; sys.exit(0 if ctypes.util.find_library("archive") else 1)'; then
            sudo apt-get update -qq
            sudo apt-get install -y libarchive-tools
          fi
      - name: Install and validate all-input prediction source
        id: install
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, subprocess, tempfile, time, zlib
          from pathlib import Path
          PAYLOAD = ''
          VERSION = 'de6d3ea27f3a7320d7a107fbd5df7029e854cb3d8546ab647ba894c25ce95006'
          compressed=base64.b64decode(PAYLOAD)
          assert hashlib.sha256(compressed).hexdigest()==VERSION, 'Repair payload checksum mismatch'
          entries=json.loads(zlib.decompress(compressed))
          marker='boat24_full_install.json'
          changed=False
          root=Path.cwd()
          def git(*args,cwd=None):
              return subprocess.check_output(['git',*args],cwd=cwd or root,text=True).strip()
          def current_marker():
              found=subprocess.run(['git','show','origin/main:'+marker],text=True,capture_output=True)
              return json.loads(found.stdout) if found.returncode==0 else {}
          for attempt in range(5):
              git('fetch','origin','main')
              if current_marker().get('version')==VERSION:
                  print('Repair version is already installed; repository code is not overwritten')
                  break
              with tempfile.TemporaryDirectory(prefix='boat24-install-') as tmp:
                  work=Path(tmp)/'checkout'
                  git('worktree','add','--detach',str(work),'origin/main')
                  try:
                      for entry in entries:
                          path=work/entry['path']
                          assert not Path(entry['path']).is_absolute() and '..' not in Path(entry['path']).parts
                          actual=hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None
                          desired=hashlib.sha256(entry['content'].encode()).hexdigest()
                          if actual not in entry['allowed_before']+[desired]:
                              raise RuntimeError('Concurrent source edit; not replacing '+entry['path'])
                          path.parent.mkdir(parents=True,exist_ok=True)
                          path.write_text(entry['content'],encoding='utf-8')
                      subprocess.run(['python','-m','unittest','discover','-s','tests','-v'],cwd=work,check=True)
                      (work/marker).write_text(json.dumps({'version':VERSION,'installer':'boat24_repair.yml'}))
                      git('add','--',*[entry['path'] for entry in entries],marker,cwd=work)
                      git('-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','Use all available race inputs in versioned predictions, preserve existing history',cwd=work)
                      pushed=subprocess.run(['git','push','origin','HEAD:main'],cwd=work)
                      if pushed.returncode==0:
                          changed=True
                          print('All-input prediction source installed')
                          break
                  finally:
                      git('worktree','remove','--force',str(work))
              time.sleep(2)
          else:
              raise RuntimeError('Could not publish repair after 5 attempts; original history retained')
          # Load the actually published code into this runner, without replacing any data.
          git('fetch','origin','main')
          for entry in entries:
              path=root/entry['path']
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(git('show','origin/main:'+entry['path'])+'\n',encoding='utf-8')

          if os.environ.get('GITHUB_OUTPUT'):
              with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('changed='+str(changed).lower()+'\n')

          PY
      - name: Validate installed source and regression tests
        run: python -m unittest discover -s tests -v
      - name: Load current inputs and preserve original history for validation
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          assert os.environ['GITHUB_REPOSITORY']=='tadasuketakahashi1234-design/-marugame-motor'
          subprocess.run(['git','fetch','origin','main'],check=True)
          for path in ['omura/docs/boat24_ledger.json','omura/docs/boat24_comparison.json','omura/docs/boat24_motor_analysis.json']:
              value=subprocess.check_output(['git','show','origin/main:'+path])
              json.loads(value)
              Path(path).write_bytes(value)
          for kind,filename in [('predictions','boat24_ledger.json'),('comparison','boat24_comparison.json')]:
              Path(os.environ['RUNNER_TEMP'],'boat24-before-'+kind+'.json').write_bytes(Path('omura/docs',filename).read_bytes())

          PY
      - name: Collect forecasts and results once
        run: python boat24_daily.py
      - name: Merge and save forecasts without discarding history
        run: python boat24_publish.py omura/docs/boat24_ledger.json
      - name: Read the saved ledger for model comparison
        run: |
          git fetch origin main
          git show origin/main:omura/docs/boat24_ledger.json > omura/docs/boat24_ledger.json
          git show origin/main:omura/docs/boat24_comparison.json > omura/docs/boat24_comparison.json
      - name: Update forward model comparison
        run: python boat24_compare.py
      - name: Merge and save comparison history
        run: python boat24_publish.py omura/docs/boat24_comparison.json --key records
      - name: Verify all original forecast and comparison records
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          subprocess.run(['git','fetch','origin','main'],check=True)
          before=json.loads(Path(os.environ['RUNNER_TEMP'],'boat24-before-predictions.json').read_text())['predictions']
          latest=json.loads(subprocess.check_output(['git','show','origin/main:omura/docs/boat24_ledger.json']))
          for code,record in before.items():
              assert code in latest['predictions'], 'Forecast disappeared: '+code
              for field in ('created_at','selection','probabilities','input_snapshot'):
                  assert record.get(field)==latest['predictions'][code].get(field), 'Forecast changed: '+code+' '+field
          comparisons=json.loads(Path(os.environ['RUNNER_TEMP'],'boat24-before-comparison.json').read_text()).get('records',{})
          new_comparison=json.loads(subprocess.check_output(['git','show','origin/main:omura/docs/boat24_comparison.json']))
          for code,record in comparisons.items():
              assert code in new_comparison.get('records',{}), 'Comparison disappeared: '+code
              for field in ('created_at','baseline','experimental','baseline_top12','baseline_top18','experimental_top12','experimental_top18'):
                  assert record.get(field)==new_comparison['records'][code].get(field), 'Comparison changed: '+code+' '+field
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Boat24 validation\n\n')
              f.write('- Original forecasts retained: '+str(len(before))+'\n')
              f.write('- Forecasts after update: '+str(len(latest['predictions']))+'\n')
              f.write('- Original comparisons retained: '+str(len(comparisons))+'\n')
              f.write('- Immutable timestamps, picks, probabilities and input snapshots: PASS\n')
              f.write('- Summary: `'+json.dumps(latest.get('summary',{}),ensure_ascii=False)+'`\n')
          print('History preservation confirmed:',len(before),'->',len(latest['predictions']))

          PY
      - name: Build current model, capture all-input forecasts and settle results
        run: python boat24_full_update.py
      - name: Merge immutable all-input histories into current main
        run: python boat24_full_publish.py
      - name: Verify all-input public website and saved pre-cutoff revisions
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_CHANGED: ${{ steps.install.outputs.changed }}
        run: |
          python - <<'PY'
          import json, os, subprocess, time, urllib.request
          from boat24_context import VERSION
          from boat24_integrity import timeparse
          repo=os.environ['GITHUB_REPOSITORY']
          if os.environ.get('SOURCE_CHANGED')=='true':
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/pages/builds',data=b'{}',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:print('Pages build requested:',r.status)
              except Exception as e:print('Pages request response:',str(e))
          base='https://tadasuketakahashi1234-design.github.io/-marugame-motor/omura/docs/'
          raw='https://raw.githubusercontent.com/'+repo+'/main/omura/docs/'
          def read(url):
              with urllib.request.urlopen(urllib.request.Request(url+'?verify='+str(time.time_ns()),headers={'User-Agent':'boat24-all-input-verification'}),timeout=30) as r:return r.read().decode()
          for attempt in range(12):
              try:
                  html=read(base+'boat24_results.html');assert 'fullForecastPanel' in html and 'boat24_full_ui.js' in html
                  script=read(base+'boat24_full_ui.js');assert 'selection_snapshot_id' in script and 'feature_usage' in script
                  index=json.loads(read(raw+'boat24_full_index.json'));assert index['model']==VERSION
                  ledger=json.loads(read(raw+'full_history/'+index['latest_day']+'.json'))
                  for record in ledger['records'].values():
                      for snap in record['revisions'].values():
                          assert timeparse(snap['created_at'])<timeparse(snap['cutoff']) and snap['evaluation_eligible']
                          assert set(snap['feature_usage']) >= {'weather','exhibition','start','motor_history','odds'}
                  break
              except Exception:
                  if attempt==11:raise
                  time.sleep(25)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('\n- All-input source and public UI: PASS\n- Model: '+VERSION+'\n- Forecasts today: '+str(len(ledger['records']))+'\n- Updated: '+index['updated_at']+'\n- Separate forward statistics: '+json.dumps(index['summary'],ensure_ascii=False)+'\n')
          print('All-input public site verified:',index['updated_at'])

          PY
      - name: Preserve observations if any step fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: boat24-recovery-${{ github.run_id }}
          path: |
            omura/docs/boat24_ledger.json
            omura/docs/boat24_comparison.json
            omura/docs/full_history/
            omura/docs/boat24_full_index.json
            omura/docs/boat24_full_model.json*
            boat24_full_pending.json
            omura/docs/boat24_official_cache.json
          retention-days: 30
