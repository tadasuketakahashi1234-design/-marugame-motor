
name: Update Omura motors

'on':
  workflow_dispatch:
  schedule:
    - cron: '25 22 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update Omura data
        run: python update_omura.py

      - name: Publish data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add omura/docs/data.json
          git diff --cached --quiet || git commit -m "Update Omura motor data"
          git push
