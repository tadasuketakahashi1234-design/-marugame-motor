<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>丸亀モーター評価</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#182235;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}main{max-width:750px;margin:auto;padding:18px}header{background:#10223e;color:white;padding:24px 18px}header>div{max-width:750px;margin:auto}h1{margin:4px 0;font-size:24px}.sub{opacity:.8;font-size:13px}.meta{font-size:13px;color:#526079;margin:12px 0}.warning{background:#fff6db;border:1px solid #eed493;padding:12px;border-radius:12px;font-size:13px;margin:12px 0}input,select{font:inherit;border:1px solid #ccd4df;border-radius:9px;padding:12px;background:white}input{width:100%}.tools{display:grid;grid-template-columns:1fr auto;gap:8px;margin:14px 0}.card{background:white;border:1px solid #dce2ec;border-radius:13px;padding:15px;margin:10px 0;box-shadow:0 2px 8px #10223e0a}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.score{font-size:25px;font-weight:800}.pill{display:inline-block;background:#e8f0ff;color:#174b9b;padding:3px 9px;border-radius:20px;font-size:12px}.small{font-size:12px;color:#627088}.details{margin-top:12px;border-top:1px solid #e2e7ed;padding-top:10px}summary{cursor:pointer;color:#175c9f;font-weight:600}.history{padding:10px 0;border-bottom:1px solid #edf0f4;font-size:13px}.error{color:#a52323}</style></head><body>
<header><div><div class="sub">BOAT MOTOR ANALYTICS · 15 MARUGAME</div><h1>丸亀 モーター評価</h1><div class="sub">全モーター / 過去3節の履歴</div></div></header>
<main><div id="meta" class="meta">データ読み込み中…</div><div id="warning" class="warning">評価は検証前の暫定値です。舟券購入の判断に単独で使わないでください。</div><div class="tools"><input id="search" type="search" placeholder="モーター番号・使用選手で検索"><select id="sort" aria-label="並べ替え"><option value="score">評価順</option><option value="number">番号順</option><option value="two">2連対率順</option></select></div><div id="count" class="small"></div><div id="list"></div></main>
<script>
let motors=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>v===null||v===undefined?'不明':Number(v).toFixed(1)+'%';
function render(){let q=document.querySelector('#search').value.trim().toLowerCase(),sort=document.querySelector('#sort').value;let a=motors.filter(m=>m.number.includes(q)||m.uses.some(u=>u.racer.toLowerCase().includes(q)));a.sort((x,y)=>sort==='number'?Number(x.number)-Number(y.number):sort==='two'?(y.two_rate??-1)-(x.two_rate??-1):y.score-x.score);document.querySelector('#count').textContent=`表示 ${a.length} / ${motors.length} モーター`;
document.querySelector('#list').innerHTML=a.map(m=>`<article class="card"><div class="head"><div><b>${esc(m.number)}号機</b> <span class="pill">${esc(m.rank)}評価</span><div class="small">2連対率 ${fmt(m.two_rate)} · 3連対率 ${fmt(m.three_rate)} · 信頼度 ${esc(m.confidence)}</div></div><div class="score">${m.score}<span class="small"> /100</span></div></div><details class="details"><summary>過去3節の使用者・着順を見る</summary>${m.uses.length?m.uses.map(u=>`<div class="history"><b>${esc(u.racer)}</b> (${esc(u.grade)})<br>${esc(u.start)} ～ ${esc(u.end)}<br>着順: ${esc(u.finishes)}<br>平均着順: ${u.avg_finish} / ${u.races}走</div>`).join(''):'<p class="small">履歴が未取得です。</p>'}</details></article>`).join('')||'<p>該当するモーターがありません。</p>'}
for(const id of ['search','sort'])document.getElementById(id).addEventListener(id==='search'?'input':'change',render);
fetch('./data.json?cache='+Date.now()).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{motors=d.motors||[];document.querySelector('#meta').textContent=`更新: ${d.updated_at} / 期成績: ${d.stats_date} / 履歴スナップショット: ${d.history_snapshot_dates.join(', ')||'未取得'}`;document.querySelector('#warning').textContent=d.warning;render()}).catch(e=>{document.querySelector('#meta').innerHTML='<span class="error">データ取得に失敗しました: '+esc(e.message)+'</span>';});
</script></body></html>
