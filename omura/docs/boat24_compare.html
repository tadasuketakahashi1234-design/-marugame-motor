<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全国24場｜予想モデル比較</title><style>body{font-family:system-ui,sans-serif;background:#eef4f9;color:#18324a;margin:0}header{background:#143c60;color:white;padding:24px 18px}main{max-width:980px;margin:auto;padding:16px}.panel{background:white;padding:18px;border-radius:15px;margin-bottom:15px;overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:530px}th,td{text-align:left;border-bottom:1px solid #d9e3eb;padding:10px}th{background:#f0f5fa}.muted{color:#5d6f7d}.warn{color:#aa4c00}a{color:#126ca7}button{background:#176da8;color:white;border:0;border-radius:8px;padding:10px 16px;font-size:16px}#status{margin-top:12px}</style></head><body><header><h1>全国24場｜予想モデル比較</h1><div>従来モデル vs モーター補正モデル（研究用）</div></header><main><div class="panel"><p><a href="boat24_results.html">← 既存の統合分析画面へ</a></p><button onclick="load()">データ更新</button><p id="status">読み込み中…</p><p class="warn">未校正モデルの比較です。収益性や的中率の改善を保証するものではありません。</p></div><div class="panel"><h2>予測精度・仮想成績</h2><table><thead><tr><th>項目</th><th>従来モデル</th><th>モーター補正</th></tr></thead><tbody id="summary"></tbody></table><p class="muted">対数損失・Brierスコアは小さいほど良好。回収率は100円均等購入を仮定した検証値です。</p></div><div class="panel"><h2>比較したレース</h2><table><thead><tr><th>レースコード</th><th>比較作成日時</th><th>実際の結果</th><th>12点 従来</th><th>12点 補正</th></tr></thead><tbody id="races"></tbody></table></div><div class="panel"><h2>注意点</h2><p id="limits"></p></div></main><script>
const fmt=(v,d=3)=>v==null?'未集計':Number(v).toFixed(d);const pct=v=>v==null?'未集計':(v*100).toFixed(1)+'%';
async function load(){const status=document.getElementById('status');status.textContent='読み込み中…';try{const r=await fetch('boat24_comparison.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json(),b=d.summary?.baseline||{},e=d.summary?.experimental||{};const rows=[['検証済みレース',b.evaluated_races??0,e.evaluated_races??0],['平均対数損失',fmt(b.mean_log_loss),fmt(e.mean_log_loss)],['平均Brierスコア',fmt(b.mean_brier_score),fmt(e.mean_brier_score)],...([12,18].flatMap(n=>[[n+'点 的中率',pct(b['top'+n]?.hit_rate),pct(e['top'+n]?.hit_rate)],[n+'点 仮想回収率',pct(b['top'+n]?.paper_roi),pct(e['top'+n]?.paper_roi)]]))];document.getElementById('summary').innerHTML=rows.map(x=>'<tr>'+x.map(y=>'<td>'+String(y)+'</td>').join('')+'</tr>').join('');const records=Object.entries(d.records||{}).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,100);document.getElementById('races').innerHTML=records.length?records.map(([code,v])=>`<tr><td>${code}</td><td>${(v.created_at||'').slice(0,16)}</td><td>${v.actual||'未確定'}</td><td>${v.actual?(v.baseline_top12||[]).includes(v.actual)?'的中':'不的中':'未確定'}</td><td>${v.actual?(v.experimental_top12||[]).includes(v.actual)?'的中':'不的中':'未確定'}</td></tr>`).join(''):'<tr><td colspan="5">比較データはまだありません。締切前の予想が保存されてから蓄積されます。</td></tr>';document.getElementById('limits').textContent=(d.limitations||[]).join('／');status.textContent='最終更新：'+(d.updated_at||'不明')+' ／ 比較記録：'+records.length+'件';}catch(e){status.textContent='比較データを読み込めません：'+e.message+'。自動実行が成功したか確認してください。';}}
load();
</script></body></html>
