<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全国24場 予想・実績台帳</title><style>body{font:15px system-ui;margin:0;background:#eef3f9;color:#1b3045}header{background:#153e64;color:white;padding:22px}main{max-width:1100px;margin:auto;padding:12px}section{background:white;padding:18px;border-radius:12px;margin:12px 0}select,button{padding:10px;font:inherit;border:1px solid #cbd5e1;border-radius:8px}button{background:#1767a8;color:white}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:8px;border-bottom:1px solid #e5eaf1;text-align:left} .scroll{overflow:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.metric{padding:14px;background:#f0f5fb;border-radius:9px}.metric strong{display:block;font-size:23px}.muted{color:#657589}.bad{color:#9c4221}</style><header><h2>全国24場｜予想・結果・回収率</h2>締切前の予想を固定保存し、結果と自動照合する検証台帳</header><main><section><label>競艇場 <select id="venue"></select></label> <button id="reload">更新</button><p id="status" class="muted">読み込み中...</p><p class="bad">モデルは未校正です。購入判定はすべて「見送り」。実際の賭け金ではなく100円単位の仮想検証です。</p></section><section><h3>累計成績</h3><div id="metrics" class="grid"></div></section><section><h3>予想と結果の履歴</h3><div id="records" class="scroll"></div></section><section><h3>データ取得状況</h3><pre id="diag" style="white-space:pre-wrap"></pre></section></main><script>
const names=['全24場','桐生','戸田','江戸川','平和島','多摩川','浜名湖','蒲郡','常滑','津','三国','びわこ','住之江','尼崎','鳴門','丸亀','児島','宮島','徳山','下関','若松','芦屋','福岡','唐津','大村'];
const $=id=>document.getElementById(id);$('venue').innerHTML=names.map((v,i)=>`<option value="${i}">${v}</option>`).join('');
let ledger=null;const esc=x=>String(x??'―').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){if(!ledger)return;let v=+$('venue').value,all=Object.values(ledger.predictions||{}).filter(r=>!v||r.venue===v).sort((a,b)=>b.race_code.localeCompare(a.race_code));let done=all.filter(r=>r.result),m=[];for(let n of [12,18]){let bets=done.map(r=>r.result.paper[String(n)]).filter(Boolean),hits=bets.filter(b=>b.hit).length,stake=bets.reduce((s,b)=>s+b.stake,0),returned=bets.reduce((s,b)=>s+b.return,0);m.push(`<div class="metric"><span>${n}点的中率</span><strong>${bets.length?(100*hits/bets.length).toFixed(1)+'%':'未集計'}</strong><small>${hits}/${bets.length}レース</small></div><div class="metric"><span>${n}点回収率</span><strong>${stake?(100*returned/stake).toFixed(1)+'%':'未集計'}</strong><small>仮想収支 ${returned-stake}円</small></div>`)}$('metrics').innerHTML=`<div class="metric">予想保存<strong>${all.length}</strong>件（結果確定 ${done.length}件）</div>`+m.join('');$('records').innerHTML='<table><tr><th>日時</th><th>場</th><th>R</th><th>判定</th><th>12点買い目</th><th>結果</th><th>12点収支</th></tr>'+all.slice(0,500).map(r=>`<tr><td>${esc(r.created_at.slice(0,16))}</td><td>${esc(names[r.venue])}</td><td>${r.race}</td><td>${esc(r.decision)}</td><td>${esc(r.selection['12'].join(', '))}</td><td>${esc(r.result?.combo||'未確定')}</td><td>${r.result?esc(r.result.paper['12'].return-1200)+'円':'―'}</td></tr>`).join('')+'</table>';}
async function load(){try{let res=await fetch('./boat24_ledger.json?t='+Date.now());if(!res.ok)throw Error('HTTP '+res.status);ledger=await res.json();$('status').textContent=`最終更新 ${ledger.updated_at} / モデル ${ledger.model} / 全${Object.keys(ledger.predictions||{}).length}件`; $('diag').textContent=JSON.stringify(ledger.diagnostics,null,2);render()}catch(e){$('status').textContent='データ未生成です。GitHub Actionsを実行してください：'+e.message}}
$('venue').onchange=render;$('reload').onclick=load;load();
</script></html>
