<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全国24場｜予想・モーター統合分析</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#193047;background:#edf3f9}*{box-sizing:border-box}body{margin:0}header{background:#123e64;color:white;padding:20px 16px}header h1{font-size:21px;margin:0 0 8px}main{max-width:1080px;margin:auto;padding:12px}section{background:white;padding:16px;border-radius:12px;margin:12px 0;box-shadow:0 1px 3px #1d355011}h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:16px 0 8px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}select,input,button{padding:10px;font:inherit;border:1px solid #cbd5e1;border-radius:8px;max-width:100%}button{background:#1767a8;color:white;cursor:pointer}select{background:white;min-width:145px}.muted{color:#63758a}.warning{color:#9b4d14}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px}.metric{background:#f0f5fb;padding:12px;border-radius:9px}.metric strong{font-size:22px;display:block}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:9px;border-bottom:1px solid #e2e8f0;text-align:left;white-space:nowrap}tr[data-motor]{cursor:pointer}tr[data-motor]:hover{background:#eff6ff}th{background:#f5f8fc}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.pill{border-radius:20px;padding:3px 9px;background:#eef4fa;font-size:12px}.panel{border:1px solid #d9e5f0;border-radius:10px;padding:12px;margin-top:10px}.small{font-size:12px} .hide{display:none}a{color:#1767a8}
</style></head><body><header><h1>全国24場｜予想・モーター統合分析</h1><div>予想・回収率・過去3節・選手補正・調子・気象条件をまとめて確認</div></header><main>
<section><div class="row"><label>競艇場 <select id="venue"></select></label><button id="reload">データ更新</button></div><p id="status" class="muted">読み込み中...</p><p class="warning small">モーター評価は研究用の暫定スコアです。過去3節の区切りと交換時期は未検証。予測モデルは未校正のため購入判定は「見送り」です。</p></section>
<section><h2>予想・回収率</h2><div id="metrics" class="grid"></div><h3>予想と結果の履歴</h3><div id="records" class="scroll"></div></section>
<section><h2>モーター個別分析（①〜⑤）</h2><p id="motorStatus" class="muted">分析データを読み込み中...</p><div id="motorMetrics" class="grid"></div><div class="row" style="margin-top:14px"><label>モーター番号 <input id="motorSearch" inputmode="numeric" placeholder="例：25" style="width:130px"></label><label>表示件数 <select id="limit"><option>30</option><option>100</option><option>300</option></select></label></div><div id="motorTable" class="scroll" style="margin-top:12px"></div><div id="motorDetail" class="panel"><span class="muted">一覧のモーターをタップすると、過去3節・補正スコア・上昇下降・気象別分析を表示します。</span></div></section>
<section><h2>データ取得状況と未対応項目</h2><h3>① 過去データの取得件数</h3><div id="coverage" class="scroll"></div><h3>取得できない情報・検証上の制約</h3><div id="limitations"></div><h3>予想側の収集診断</h3><pre id="diag"></pre></section>
</main><script>
'use strict';
const names=['全24場','桐生','戸田','江戸川','平和島','多摩川','浜名湖','蒲郡','常滑','津','三国','びわこ','住之江','尼崎','鳴門','丸亀','児島','宮島','徳山','下関','若松','芦屋','福岡','唐津','大村'];
const $=id=>document.getElementById(id), esc=x=>String(x??'―').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(x,d=1)=>x==null||!Number.isFinite(Number(x))?'未取得':Number(x).toFixed(d);
$('venue').innerHTML=names.map((n,i)=>`<option value="${i}">${n}</option>`).join('');
let ledger=null,motorData=null,selectedMotor=null;
function renderPredictions(){if(!ledger)return;const v=+$('venue').value;const all=Object.values(ledger.predictions||{}).filter(r=>!v||r.venue===v).sort((a,b)=>String(b.race_code).localeCompare(String(a.race_code)));const done=all.filter(r=>r.result);let tiles=[`<div class="metric">予想保存<strong>${all.length}</strong>結果確定 ${done.length}件</div>`];for(const n of [12,18]){const bets=done.map(r=>r.result?.paper?.[String(n)]).filter(Boolean);const hits=bets.filter(b=>b.hit).length,stake=bets.reduce((s,b)=>s+(b.stake||0),0),returned=bets.reduce((s,b)=>s+(b.return||0),0);tiles.push(`<div class="metric">${n}点的中率<strong>${bets.length?fmt(hits*100/bets.length)+'%':'未集計'}</strong>${hits}/${bets.length}レース</div><div class="metric">${n}点回収率<strong>${stake?fmt(returned*100/stake)+'%':'未集計'}</strong>仮想収支 ${returned-stake}円</div>`)}$('metrics').innerHTML=tiles.join('');$('records').innerHTML='<table><thead><tr><th>日時</th><th>場</th><th>R</th><th>判定</th><th>12点買い目</th><th>結果</th><th>12点収支</th></tr></thead><tbody>'+all.slice(0,300).map(r=>`<tr><td>${esc(String(r.created_at||'').slice(0,16))}</td><td>${esc(names[r.venue])}</td><td>${esc(r.race)}</td><td>${esc(r.decision)}</td><td>${esc((r.selection?.['12']||[]).join(', '))}</td><td>${esc(r.result?.combo||'未確定')}</td><td>${r.result?esc((r.result.paper?.['12']?.return||0)-(r.result.paper?.['12']?.stake||1200))+'円':'―'}</td></tr>`).join('')+'</tbody></table>';$('diag').textContent=JSON.stringify(ledger.diagnostics||{},null,2)}
function filteredMotors(){if(!motorData)return [];const v=+$('venue').value;const q=$('motorSearch').value.trim().replace(/^0+/, '');return Object.entries(motorData.motors||{}).filter(([k])=>(!v||Number(k.split('-')[0])===v)&&(!q||k.split('-')[1].includes(q))).sort((a,b)=>(b[1].races||0)-(a[1].races||0))}
function renderMotors(){if(!motorData)return;const all=filteredMotors();const count=all.length;const limit=+$('limit').value;const total=motorData.data_availability_audit||{};$('motorMetrics').innerHTML=`<div class="metric">表示モーター<strong>${count}</strong>件</div><div class="metric">収集対象日数<strong>${esc(total.dates_checked??'―')}</strong>日</div><div class="metric">走行記録<strong>${esc(total.motor_records??'―')}</strong>件（全国）</div><div class="metric">取得エラー<strong>${(motorData.source_errors||[]).length}</strong>件</div>`;
$('motorTable').innerHTML='<table><thead><tr><th>場</th><th>モーター</th><th>走数</th><th>③選手補正</th><th>④変化</th><th>②暫定節数</th><th>⑤気象サンプル</th></tr></thead><tbody>'+all.slice(0,limit).map(([key,r])=>{const [venue,num]=key.split('-');return `<tr data-motor="${esc(key)}"><td>${esc(names[+venue]||venue)}</td><td>${esc(num)}号</td><td>${esc(r.races)}</td><td>${fmt(r.racer_adjusted_motor_score_experimental,1)}</td><td>${r.trend_change_experimental==null?'未算出':(r.trend_change_experimental>0?'+':'')+fmt(r.trend_change_experimental,2)}</td><td>${esc(r.series_count_provisional)}</td><td>${esc((r.weather_condition_analysis?.calm?.races||0)+(r.weather_condition_analysis?.windy?.races||0))}</td></tr>`}).join('')+'</tbody></table><p class="small muted">表示は上位'+Math.min(limit,count)+'件。行をタップして詳細を確認できます。スコアは未検証です。</p>';
$('motorTable').querySelectorAll('[data-motor]').forEach(tr=>tr.addEventListener('click',()=>{selectedMotor=tr.getAttribute('data-motor');renderMotorDetail()}));if(selectedMotor&&motorData.motors[selectedMotor])renderMotorDetail();else $('motorDetail').innerHTML='<span class="muted">モーターを選択してください。</span>'}
function renderMotorDetail(){const r=motorData?.motors?.[selectedMotor];if(!r)return;const [v,n]=selectedMotor.split('-');const series=r.last_3_series_provisional||[];const conditions=r.weather_condition_analysis||{};const labels={calm:'弱風（3m/s未満）',windy:'強風（3m/s以上）',low_wave:'低波（5cm未満）',high_wave:'高波（5cm以上）'};$('motorDetail').innerHTML=`<h3>${esc(names[+v])} ${esc(n)}号モーター</h3><div class="grid"><div class="metric">③選手補正スコア<strong>${fmt(r.racer_adjusted_motor_score_experimental)}</strong>研究用・未校正</div><div class="metric">④直近変化<strong>${fmt(r.trend_change_experimental,2)}</strong>上昇・下降の暫定差分</div><div class="metric">②推定開催数<strong>${esc(r.series_count_provisional)}</strong>正式な節区切りではありません</div></div><h3>② 過去3節（開催区切りは暫定）</h3><div class="scroll"><table><tr><th>期間</th><th>使用選手</th><th>走数</th><th>平均着順</th><th>平均展示</th><th>平均ST展示</th></tr>${series.map(s=>`<tr><td>${esc(s.start)}〜${esc(s.end)}</td><td>${esc((s.racers||[]).join('・'))}</td><td>${esc(s.race_count)}</td><td>${fmt(s.mean_finish,2)}</td><td>${fmt(s.mean_exhibition,2)}</td><td>${fmt(s.mean_start_exhibition,3)}</td></tr>`).join('')}</table></div><h3>⑤ 気象条件別の着順</h3><div class="scroll"><table><tr><th>条件</th><th>対象走数</th><th>平均着順</th><th>件数判定</th></tr>${Object.entries(labels).map(([key,label])=>{const c=conditions[key]||{};return `<tr><td>${label}</td><td>${esc(c.races||0)}</td><td>${fmt(c.mean_finish,2)}</td><td>${c.sufficient_sample?'20件以上':'標本不足'}</td></tr>`}).join('')}</table></div><p class="warning small">気象による因果効果は証明されていません。使用選手・コース・開催場の影響が残ります。モーター交換日未検証のため異なる個体が混在する可能性があります。</p>`}
function renderAudit(){if(!motorData)return;const c=motorData.coverage||{};const dates=Object.keys(c).sort().reverse();$('coverage').innerHTML='<table><tr><th>日付</th><th>出走表</th><th>結果</th><th>展示</th><th>ST展示</th><th>気象</th></tr>'+dates.map(d=>`<tr><td>${esc(d)}</td>${['cards','results','ex','st','weather'].map(k=>`<td>${esc(c[d]?.[k]??0)}</td>`).join('')}</tr>`).join('')+'</table>';const l=motorData.limitations||{};$('limitations').innerHTML=`<p class="small">正式な節ID：${esc(l.official_series_id)} ／ モーター交換時期：${esc(l.motor_replacement_dates)} ／ 潮位：${esc(l.tide)} ／ 予想への学習反映：${esc(l.probability_training)}</p><p class="small warning">${esc(l.validation)}</p>`}
async function getJSON(path){const res=await fetch(path+'?t='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);return res.json()}
async function load(){const results=await Promise.allSettled([getJSON('./boat24_ledger.json'),getJSON('./boat24_motor_analysis.json')]);if(results[0].status==='fulfilled'){ledger=results[0].value;$('status').textContent='予想更新：'+(ledger.updated_at||'不明')+' ／ モデル：'+(ledger.model||'不明');renderPredictions()}else $('status').textContent='予想データを取得できません：'+results[0].reason.message;if(results[1].status==='fulfilled'){motorData=results[1].value;$('motorStatus').textContent='モーター分析更新：'+(motorData.generated_at||'不明')+' ／ 研究用・未検証';renderMotors();renderAudit()}else $('motorStatus').textContent='モーター分析データを取得できません：'+results[1].reason.message+'。GitHub Actionsの結果とJSON公開を確認してください。'}
$('venue').addEventListener('change',()=>{selectedMotor=null;renderPredictions();renderMotors()});$('motorSearch').addEventListener('input',renderMotors);$('limit').addEventListener('change',renderMotors);$('reload').addEventListener('click',load);load();
</script></body></html>
